<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM CONQUEST</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #121824;
      --accent-color: #00f0ff;
      --accent-danger: #ff3b5c;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --border-color: #1e293b;
      --user-bg: #1a2333;
      --error-bg: rgba(255, 59, 92, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      background-image: radial-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title-area {
      display: flex;
      flex-direction: column;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      line-height: 1.1;
    }

    .badge-nsfw {
      background: rgba(255, 59, 92, 0.15);
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-btns {
      display: flex;
      gap: 6px;
    }

    .btn-header {
      background: #182232;
      border: 1px solid #2a384c;
      color: var(--accent-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-reset {
      color: var(--accent-danger);
      border-color: rgba(255, 59, 92, 0.3);
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
      margin-bottom: 12px;
    }

    .msg {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user-msg {
      background: var(--user-bg);
      border-left: 3px solid var(--accent-color);
      color: var(--accent-color);
      font-style: italic;
      align-self: flex-end;
      max-width: 90%;
    }

    .system-msg {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .error-msg {
      background: var(--error-bg);
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      font-size: 0.85rem;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .quick-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .btn-quick {
      background: #182232;
      border: 1px solid #2a384c;
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-quick:active {
      transform: scale(0.96);
    }

    .input-area {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-execute {
      background: linear-gradient(135deg, #00f0ff, #0077ff);
      border: none;
      color: #000;
      font-weight: 800;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <div class="title-row">
        <h1>SYSTEM CONQUEST</h1>
        <span class="badge-nsfw">v1.0 NSFW</span>
      </div>
      <div class="subtitle">Shinjuku Protocol // Host: Active</div>
    </div>
    <div class="header-btns">
      <button class="btn-header" onclick="setApiKey()">🔑 API Key</button>
      <button class="btn-header btn-reset" onclick="resetGame()">🔄 Reset</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div class="quick-actions">
    <span class="quick-title">Quick Action:</span>
    <button class="btn-quick" onclick="triggerQuick('Do Push-ups')">💪 Do Push-ups</button>
    <button class="btn-quick" onclick="triggerQuick('Explore Shinjuku')">🏙️ Explore Shinjuku</button>
    <button class="btn-quick" onclick="triggerQuick('Open System Shop')">🛒 Open System Shop</button>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="What do you do? (e.g. Talk to...)" onkeypress="handleKeyPress(event)">
    <button class="btn-execute" onclick="sendAction()">EXECUTE</button>
  </div>

      } else {
        appendMessage("system", "System Conquest initialized. Host status: Active.");
      }

      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem("gemini_api_key", apiKey);
        alert("API-nøkkel lagret!");
      }
    }
