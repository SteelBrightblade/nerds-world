<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Nerd's World</title>
  <style>
    :root {
      --bg-color: #0a0a0f;
      --card-bg: #12121a;
      --accent-color: #00f0ff;
      --text-color: #e2e8f0;
      --border-color: #1e1e2d;
      --error-color: #ff4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      padding: 10px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.2rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    button {
      background: #1a1a26;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--accent-color);
      color: var(--bg-color);
    }

    #chat-box {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 10px;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user-msg {
      background: #1a2234;
      border-left: 3px solid var(--accent-color);
      align-self: flex-end;
      max-width: 85%;
    }

    .system-msg {
      background: #14141f;
      border: 1px solid var(--border-color);
      align-self: flex-start;
      width: 100%;
    }

    .error-msg {
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      width: 100%;
    }

    .input-area {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    input[type="text"] {
      flex: 1;
      background: #0a0a0f;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>A Nerd's World</h1>
    <div class="controls">
      <button onclick="setApiKey()">🔑 API Key</button>
      <button onclick="resetGame()">🔄 Reset</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Hva gjør du? (f.eks. Sjekk oppdrag...)" onkeypress="handleKeyPress(event)">
    <button onclick="sendAction()">EXECUTE</button>
  </div>

  <script>
    const SYSTEM_PROMPT = `You are the System in an interactive text-based RPG titled "A Nerd's World". The context is modern/urban, centered around an AI System interface interacting with the protagonist. Always structure responses with Narrative, System Panel updates, and Options/Choices. Maintain the core game theme continuously.`;

    let apiKey = localStorage.getItem("gemini_api_key") || "";
    let history = [{ role: "user", parts: [{ text: SYSTEM_PROMPT }] }];

    function init() {
      if (!apiKey) {
        setApiKey();
      } else {
        appendMessage("system", "System initialized. Welcome to A Nerd's World.");
      }
    }

    function setApiKey() {
      const key = prompt("Vennligst skriv inn din Google Gemini API-nøkkel:", apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem("gemini_api_key", apiKey);
        alert("API-nøkkel lagret!");
      }
    }

    function resetGame() {
      if (confirm("Vil du starte spillet på nytt?")) {
        history = [{ role: "user", parts: [{ text: SYSTEM_PROMPT }] }];
        document.getElementById("chat-box").innerHTML = "";
        appendMessage("system", "System resatt. A Nerd's World er klar.");
      }
    }

    function appendMessage(type, text) {
      const chatBox = document.getElementById("chat-box");
      const msg = document.createElement("div");
      msg.className = `msg ${type}-msg`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendAction();
    }

    async function sendAction() {
      const inputEl = document.getElementById("userInput");
      const actionText = inputEl.value.trim();

      if (!apiKey) {
        alert("Du må legge inn en API-nøkkel først!");
        setApiKey();
        return;
      }

      if (!actionText) return;

      appendMessage("user", `> ${actionText}`);
      history.push({ role: "user", parts: [{ text: actionText }] });
      inputEl.value = "";

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: history,
          // Senker sikkerhetsrestriksjoner litt for å unngå unødvendige stopp i rollespillet
          safetySettings: [
            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_MEDIUM_AND_ABOVE" },
            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_MEDIUM_AND_ABOVE" }
          ]
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || `HTTP error! Status: ${response.status}`);
      }

      if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
        throw new Error("Svaret ble blokkert av sikkerhetsfiltre eller mangler innhold.");
      }

      const aiReply = data.candidates[0].content.parts[0].text;

      history.push({ role: "model", parts: [{ text: aiReply }] });
      appendMessage("system", aiReply);
    } catch (err) {
      appendMessage("error", `[ERROR]: ${err.message}`);
    }
  }

    window.onload = init;
  </script>
</body>
</html>
